services:
  certbot-cloudflare:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-cert:latest
    container_name: certbot-cloudflare
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, for example example.com}
      EMAIL: ${EMAIL:-admin@example.com}
      CERTBOT_DOMAINS: ${CERTBOT_DOMAINS:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_EMAIL: ${CLOUDFLARE_EMAIL:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_PROPAGATION_SECONDS: ${CLOUDFLARE_PROPAGATION_SECONDS:-60}
      CERT_CRON: ${CERT_CRON:-17 3 * * *}
      RENEW_BEFORE_DAYS: ${RENEW_BEFORE_DAYS:-30}
      RUN_ONCE: ${RUN_ONCE:-false}
      STAGING: ${STAGING:-false}
      CERT_OUTPUT_DIR: /certs
      LOG_DIR: /logs
    volumes:
      - ./certs:/certs
      - ./letsencrypt:/etc/letsencrypt
      - ./letsencrypt-lib:/var/lib/letsencrypt
      - ./logs:/logs
